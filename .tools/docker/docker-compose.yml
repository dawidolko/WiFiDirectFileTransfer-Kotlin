name: wifidirect-project

services:
  build:
    build:
      context: ../../
      dockerfile: .tools/docker/Dockerfile
    container_name: wifidirect-build
    working_dir: /workspace/WifiDirect
    volumes:
      - ../../:/workspace
      # The Gradle cache survives a container restart - without it every build
      # downloads dependencies again.
      - gradle-cache:/root/.gradle
    command: ./gradlew assembleDebug

volumes:
  gradle-cache:
